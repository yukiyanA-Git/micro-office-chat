<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Desk Chat (デスクチャット)</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css?v=20260806_2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- Firebase SDKs (v9 Compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
</head>
<body>

  <!-- 超コンパクトメインウィンドウ container -->
  <div class="chat-container" id="chatContainer">
    
    <!-- ウルトラコンパクトヘッダー -->
    <header class="app-header" id="dragHeader">
      <div class="header-title">
        <span class="app-icon" id="roomThemeIcon">💬</span>
        <span class="app-name" id="currentRoomTitle">Desk Chat</span>
      </div>
      <div class="header-actions">
        <button id="soundToggleBtn" class="icon-btn active" title="通知音 (ON/OFF)">🔊</button>
        <button id="pinBtn" class="icon-btn" title="最前面にピン留め (ON/OFF)">📌</button>
        <button id="configBtn" class="icon-btn" title="現在の部屋の設定・変更">⚙️</button>
        <button id="popoutBtn" class="icon-btn" title="小窓ポップアップ表示">↗️</button>
      </div>
    </header>

    <!-- 部屋切り替えドロップダウン & 追加ボタン -->
    <nav class="group-select-bar">
      <div class="select-wrapper">
        <span class="room-icon">🏢</span>
        <select id="roomSelector" title="部屋の切り替え"></select>
      </div>
      <button id="addRoomBtn" class="small-add-btn" title="新しい部屋を追加">＋部屋追加</button>
    </nav>

    <!-- メンバーのオンライン在席表示バー (先頭1文字アバター) -->
    <section class="members-bar">
      <div class="members-label">メンバー (在席):</div>
      <div class="members-list" id="membersList"></div>
    </section>

    <!-- ツールバー (ログクリア 🧹 / コピー 📋 / ステータス変更) -->
    <section class="toolbar">
      <div class="status-selector">
        <label for="myStatus">自ステータス:</label>
        <select id="myStatus">
          <option value="🟢 在席">🟢 在席</option>
          <option value="🏃 離席中">🏃 離席中</option>
          <option value="📞 会議中">📞 会議中</option>
          <option value="🍱 休憩中">🍱 休憩中</option>
        </select>
      </div>
      <div class="tool-actions">
        <button id="copyLogBtn" class="small-btn" title="チャットログを全コピー">📋 コピー</button>
        <button id="clearAllBtn" class="small-btn danger-btn" title="チャットログを一括全消去">🧹 消去</button>
      </div>
    </section>

    <!-- チャットタイムライン表示エリア -->
    <main class="chat-timeline" id="chatTimeline">
      <div class="timeline-empty-notice" id="emptyNotice">
        💬 まだメッセージはありません。<br>下のクイックボタンで声を掛けましょう！
      </div>
    </main>

    <!-- ワンタップ・クイック声掛けリアクションボタン -->
    <section class="quick-stamps" id="quickStampsArea">
      <!-- 上段 -->
      <button class="stamp-btn" data-stamp="〇 了解">〇 了解</button>
      <button class="stamp-btn" data-stamp="✕ NG">✕ NG</button>
      <button class="stamp-btn" data-stamp="🤔 考え中">🤔 考え中</button>
      <!-- 下段 -->
      <button class="stamp-btn" data-stamp="👀 確認中">👀 確認中</button>
      <button class="stamp-btn" data-stamp="📞 後で連絡します">📞 後で連絡します</button>
      <button class="stamp-btn" data-stamp="📞 連絡いただきたい">📞 連絡いただきたい</button>
    </section>

    <!-- 入力フォーム ＋ ファイル添付 -->
    <footer class="chat-input-area">
      <div class="file-attachment-preview" id="filePreview" style="display: none;">
        <span id="fileNameDisplay">file.png</span>
        <button id="removeFileBtn" class="remove-file-btn">✕</button>
      </div>
      <form id="messageForm" class="input-form">
        <label for="fileInput" class="file-attach-btn" title="ファイル・画像を添付">📎
          <input type="file" id="fileInput" style="display: none;">
        </label>
        <input type="text" id="messageInput" placeholder="ちょっとしたメッセージ..." autocomplete="off">
        <button type="submit" class="send-btn" id="sendBtn">送信</button>
      </form>
    </footer>

  </div>

  <!-- 【⚙️ 設定モーダル】：現在の部屋の編集・確認 -->
  <div class="modal-overlay" id="configModal" style="display: none;">
    <div class="modal-card">
      <h3>⚙️ 設定 ＆ 部屋の編集</h3>
      <div class="form-group">
        <label for="userNameInput">あなたの表示名 (苗字):</label>
        <input type="text" id="userNameInput" placeholder="例: 苗字または名前を入力">
        <small>※先頭の1文字（例: 「山」）がアバターになります。</small>
      </div>

      <hr>

      <!-- 現在開いている部屋の編集・確認セクション -->
      <h4 id="editRoomSectionTitle">✏️ 現在の部屋の設定変更</h4>
      <div class="form-group">
        <label for="editRoomNameInput">部屋名:</label>
        <input type="text" id="editRoomNameInput" placeholder="部屋の名前">
      </div>
      <div class="form-group">
        <label for="editRoomIdInput">部屋ID (部屋IDは編集できません):</label>
        <input type="text" id="editRoomIdInput" disabled style="opacity:0.7; cursor:not-allowed;">
      </div>
      <div class="form-group">
        <label for="editPasscodeInput">合言葉 (パスコード):</label>
        <input type="text" id="editPasscodeInput" placeholder="例: 1234 (空欄可)">
      </div>

      <div class="form-group">
        <label for="editPurgeTimeSelect">⏰ 毎日の自動ログクリア時刻:</label>
        <select id="editPurgeTimeSelect">
          <option value="00:00">00:00 (深夜0時・デフォルト)</option>
          <option value="01:00">01:00 (深夜1時)</option>
          <option value="02:00">02:00 (深夜2時)</option>
          <option value="03:00">03:00 (深夜3時)</option>
          <option value="04:00">04:00 (早朝4時)</option>
          <option value="05:00">05:00 (早朝5時)</option>
          <option value="06:00">06:00 (朝6時)</option>
          <option value="07:00">07:00 (朝7時)</option>
          <option value="08:00">08:00 (朝8時)</option>
          <option value="09:00">09:00 (朝9時)</option>
          <option value="12:00">12:00 (正午)</option>
          <option value="18:00">18:00 (夕方6時)</option>
          <option value="21:00">21:00 (夜9時)</option>
        </select>
      </div>

      <div class="form-group">
        <label>🎨 My テーマカラー (個人用カラー):</label>
        <div class="color-picker-options" id="editColorPickerOptions">
          <button type="button" class="color-btn" data-color="indigo" style="background: #6366f1;" title="インディゴ"></button>
          <button type="button" class="color-btn" data-color="emerald" style="background: #10b981;" title="エメラルドグリーン"></button>
          <button type="button" class="color-btn" data-color="purple" style="background: #8b5cf6;" title="パープル"></button>
          <button type="button" class="color-btn" data-color="rose" style="background: #f43f5e;" title="ローズレッド"></button>
          <button type="button" class="color-btn" data-color="amber" style="background: #f59e0b;" title="アンバーオレンジ"></button>
          <button type="button" class="color-btn" data-color="cyan" style="background: #06b6d4;" title="シアンブルー"></button>
        </div>
      </div>

      <button id="saveCurrentRoomConfigBtn" class="primary-btn" style="width: 100%; margin-top: 4px; margin-bottom: 8px;">💾 設定を更新して保存</button>

      <hr>

      <h4>📋 参加中の部屋一覧（ID・合言葉・共有）</h4>
      <div id="savedRoomsList" class="saved-rooms-list"></div>

      <div class="modal-actions" style="justify-content: space-between;">
        <button id="resetStateBtn" class="danger-btn small-btn" style="padding: 4px 8px;">🗑️ 登録名をリセット</button>
        <button id="closeConfigModalBtn" class="secondary-btn">閉じる</button>
      </div>
    </div>
  </div>

  <!-- 【＋部屋追加 モーダル】：新規部屋の作成・参加 -->
  <div class="modal-overlay" id="addRoomModal" style="display: none;">
    <div class="modal-card">
      <h3>➕ 新しい部屋を作成・参加する</h3>
      
      <div class="form-group">
        <label for="newRoomNameInput">部屋名 (例: 営業チーム, プロジェクトA):</label>
        <input type="text" id="newRoomNameInput" placeholder="部屋の名前を入力">
      </div>
      <div class="form-group">
        <label for="newRoomIdInput">部屋ID (英数字・共有用ID):</label>
        <input type="text" id="newRoomIdInput" placeholder="例: room-01">
      </div>
      <div class="form-group">
        <label for="newPasscodeInput">合言葉 (パスコード):</label>
        <input type="text" id="newPasscodeInput" placeholder="例: 1234 (空欄可)">
      </div>
      <div class="form-group">
        <label for="newPurgeTimeSelect">⏰ 毎日の自動ログクリア時刻:</label>
        <select id="newPurgeTimeSelect">
          <option value="00:00" selected>00:00 (深夜0時・デフォルト)</option>
          <option value="01:00">01:00 (深夜1時)</option>
          <option value="05:00">05:00 (早朝5時)</option>
          <option value="09:00">09:00 (朝9時)</option>
          <option value="12:00">12:00 (正午)</option>
          <option value="18:00">18:00 (夕方6時)</option>
        </select>
      </div>
      
      <div class="modal-actions" style="justify-content: space-between; margin-top: 12px;">
        <button id="closeAddRoomModalBtn" class="secondary-btn">キャンセル</button>
        <button id="addNewRoomConfirmBtn" class="primary-btn">＋ 部屋を作成して移動</button>
      </div>
    </div>
  </div>

  <script>
    // 古いキャッシュをクリア
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(registrations => {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }

    const firebaseConfig = {
      apiKey: "AIzaSyDTcSTgVeVYix7oJiPVfNXqH3QtNzuduuM",
      authDomain: "micro-chat-c25bb.firebaseapp.com",
      projectId: "micro-chat-c25bb",
      storageBucket: "micro-chat-c25bb.firebasestorage.app",
      messagingSenderId: "384583388483",
      appId: "1:384583388483:web:7c6dfe83100b89e1efb3f6",
      measurementId: "G-3TRBLWK51N",
      databaseURL: "https://micro-chat-c25bb-default-rtdb.firebaseio.com"
    };

    let db = null;
    try {
      if (typeof firebase !== 'undefined') {
        firebase.initializeApp(firebaseConfig);
        db = firebase.database();
      }
    } catch (e) {
      console.warn("Firebase Init fallback to BroadcastChannel:", e);
    }

    document.addEventListener('DOMContentLoaded', () => {
      const bc = new BroadcastChannel('micro_office_chat_channel');

      const chatContainer = document.getElementById('chatContainer');
      const soundToggleBtn = document.getElementById('soundToggleBtn');
      const pinBtn = document.getElementById('pinBtn');
      const configBtn = document.getElementById('configBtn');
      const popoutBtn = document.getElementById('popoutBtn');
      const roomSelector = document.getElementById('roomSelector');
      const addRoomBtn = document.getElementById('addRoomBtn');
      const currentRoomTitle = document.getElementById('currentRoomTitle');
      const membersList = document.getElementById('membersList');
      const myStatusSelect = document.getElementById('myStatus');
      const copyLogBtn = document.getElementById('copyLogBtn');
      const clearAllBtn = document.getElementById('clearAllBtn');
      const chatTimeline = document.getElementById('chatTimeline');
      const messageForm = document.getElementById('messageForm');
      const messageInput = document.getElementById('messageInput');
      const fileInput = document.getElementById('fileInput');
      const filePreview = document.getElementById('filePreview');
      const fileNameDisplay = document.getElementById('fileNameDisplay');
      const removeFileBtn = document.getElementById('removeFileBtn');
      const quickStampsArea = document.getElementById('quickStampsArea');

      const configModal = document.getElementById('configModal');
      const userNameInput = document.getElementById('userNameInput');
      const editRoomSectionTitle = document.getElementById('editRoomSectionTitle');
      const editRoomNameInput = document.getElementById('editRoomNameInput');
      const editRoomIdInput = document.getElementById('editRoomIdInput');
      const editPasscodeInput = document.getElementById('editPasscodeInput');
      const editPurgeTimeSelect = document.getElementById('editPurgeTimeSelect');
      const editColorPickerOptions = document.getElementById('editColorPickerOptions');
      const saveCurrentRoomConfigBtn = document.getElementById('saveCurrentRoomConfigBtn');
      const savedRoomsList = document.getElementById('savedRoomsList');
      const closeConfigModalBtn = document.getElementById('closeConfigModalBtn');
      const resetStateBtn = document.getElementById('resetStateBtn');

      const addRoomModal = document.getElementById('addRoomModal');
      const newRoomNameInput = document.getElementById('newRoomNameInput');
      const newRoomIdInput = document.getElementById('newRoomIdInput');
      const newPasscodeInput = document.getElementById('newPasscodeInput');
      const newPurgeTimeSelect = document.getElementById('newPurgeTimeSelect');
      const addNewRoomConfirmBtn = document.getElementById('addNewRoomConfirmBtn');
      const closeAddRoomModalBtn = document.getElementById('closeAddRoomModalBtn');

      let selectedEditColorTheme = 'indigo';
      let isSoundEnabled = true;
      let unreadCount = 0;

      let appState = JSON.parse(localStorage.getItem('micro_office_chat_state'));
      if (appState && appState.userName === '山田') {
        appState.userName = '';
        localStorage.setItem('micro_office_chat_state', JSON.stringify(appState));
      }

      if (!appState) {
        appState = {
          userName: '',
          userStatus: '🟢 在席',
          activeRoomId: 'room1',
          rooms: [
            { id: 'room1', name: 'トークルーム1', passcode: '', color: 'indigo', purgeTime: '00:00' }
          ],
          isPinned: false
        };
      }

      let myId = localStorage.getItem('micro_office_chat_uid');
      if (!myId) {
        myId = 'u_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
        localStorage.setItem('micro_office_chat_uid', myId);
      }

      let activeMembers = {};
      let userLastReadTimes = {};
      let attachedFile = null;
      let currentMessages = [];
      let activeFirebaseListenerKey = null;

      if ('Notification' in window && Notification.permission !== 'granted' && Notification.permission !== 'denied') {
        Notification.requestPermission();
      }

      function getSessionDateString(dateObj, purgeTimeStr) {
        const d = new Date(dateObj || Date.now());
        const [targetHour, targetMin] = (purgeTimeStr || '00:00').split(':').map(Number);
        
        if (d.getHours() < targetHour || (d.getHours() === targetHour && d.getMinutes() < targetMin)) {
          d.setDate(d.getDate() - 1);
        }
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      }

      function getRoomFirebaseKey(room) {
        if (!room) return 'room1';
        const passcodeStr = (room.passcode || 'none').trim();
        return `${room.id}_${passcodeStr}`;
      }

      // mousemove を完全削除！(チカチカの原因を100%排除)
      const readTriggers = ['click', 'touchstart', 'pointerdown', 'focusin'];
      readTriggers.forEach(evtType => {
        chatContainer.addEventListener(evtType, markCurrentMessagesAsRead, { passive: true });
      });
      chatTimeline.addEventListener('scroll', markCurrentMessagesAsRead, { passive: true });

      function autoReadIfActive() {
        if (document.visibilityState === 'visible' && document.hasFocus()) {
          markCurrentMessagesAsRead();
        }
      }

      window.addEventListener('focus', () => handleMobileResume());
      window.addEventListener('pageshow', () => handleMobileResume());
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
          handleMobileResume();
        }
      });

      function handleMobileResume() {
        if (db) {
          db.goOnline();
        }
        markCurrentMessagesAsRead();
        subscribeCurrentRoom();
        announcePresence();
      }

      // 既読の連打・高頻度書き込みを抑止するデバウンス（最低3秒に1回）
      let lastSentReadTime = 0;
      function markCurrentMessagesAsRead() {
        unreadCount = 0;
        updateBadgeUI();

        const curRoom = getCurrentRoom();
        if (!curRoom || !db || !appState.userName) return;

        const now = Date.now();
        if (now - lastSentReadTime < 3000) return; // 3秒以内は連投しない
        lastSentReadTime = now;

        const roomKey = getRoomFirebaseKey(curRoom);

        db.ref(`rooms/${roomKey}/lastRead/${myId}`).set({
          userId: myId,
          userName: appState.userName,
          readTime: now
        });
      }

      function updateBadgeUI() {
        const curRoom = getCurrentRoom();
        const baseTitle = curRoom ? curRoom.name : 'Desk Chat';
        if (unreadCount > 0) {
          document.title = `(${unreadCount}) 💬 ${baseTitle}`;
          if ('setAppBadge' in navigator) {
            navigator.setAppBadge(unreadCount).catch(() => {});
          }
        } else {
          document.title = `💬 ${baseTitle}`;
          if ('clearAppBadge' in navigator) {
            navigator.clearAppBadge().catch(() => {});
          }
        }
      }

      function init() {
        userNameInput.value = appState.userName;
        myStatusSelect.value = appState.userStatus;
        updateRoomSelectorUI();
        applyPinState(appState.isPinned);
        applyRoomTheme();
        subscribeCurrentRoom();
        announcePresence();
        bindStampButtons();
        markCurrentMessagesAsRead();
      }

      function saveState() {
        localStorage.setItem('micro_office_chat_state', JSON.stringify(appState));
      }

      resetStateBtn.addEventListener('click', () => {
        if (confirm('保存された名前や部屋設定をリセットしますか？')) {
          localStorage.removeItem('micro_office_chat_state');
          localStorage.removeItem('micro_office_chat_uid');
          location.reload();
        }
      });

      function playNotificationSound() {
        if (!isSoundEnabled) return;
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          
          osc.type = 'sine';
          osc.frequency.setValueAtTime(587.33, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.15);
          
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);

          osc.connect(gain);
          gain.connect(ctx.destination);
          
          osc.start();
          osc.stop(ctx.currentTime + 0.3);
        } catch (e) {
          console.warn("Sound play error:", e);
        }
      }

      soundToggleBtn.addEventListener('click', () => {
        isSoundEnabled = !isSoundEnabled;
        if (isSoundEnabled) {
          soundToggleBtn.textContent = '🔊';
          soundToggleBtn.classList.add('active');
          soundToggleBtn.title = "通知音: ON";
          playNotificationSound();
        } else {
          soundToggleBtn.textContent = '🔇';
          soundToggleBtn.classList.remove('active');
          soundToggleBtn.title = "通知音: OFF";
        }
      });

      function updateRoomSelectorUI() {
        roomSelector.innerHTML = '';
        appState.rooms.forEach(r => {
          const opt = document.createElement('option');
          opt.value = r.id;
          opt.textContent = r.name;
          if (r.id === appState.activeRoomId) opt.selected = true;
          roomSelector.appendChild(opt);
        });
      }

      function getCurrentRoom() {
        return appState.rooms.find(r => r.id === appState.activeRoomId) || appState.rooms[0];
      }

      function applyRoomTheme() {
        const curRoom = getCurrentRoom();
        if (!curRoom) return;

        currentRoomTitle.textContent = curRoom.name;

        const colorMap = {
          indigo: { accent: '#6366f1', hover: '#4f46e5', light: 'rgba(99, 102, 241, 0.15)' },
          emerald: { accent: '#10b981', hover: '#059669', light: 'rgba(16, 185, 129, 0.15)' },
          purple: { accent: '#8b5cf6', hover: '#7c3aed', light: 'rgba(139, 92, 246, 0.15)' },
          rose: { accent: '#f43f5e', hover: '#e11d48', light: 'rgba(244, 63, 94, 0.15)' },
          amber: { accent: '#f59e0b', hover: '#d97706', light: 'rgba(245, 158, 11, 0.15)' },
          cyan: { accent: '#06b6d4', hover: '#0891b2', light: 'rgba(6, 182, 212, 0.15)' }
        };

        const theme = colorMap[curRoom.color || 'indigo'] || colorMap.indigo;
        document.documentElement.style.setProperty('--accent-color', theme.accent);
        document.documentElement.style.setProperty('--accent-hover', theme.hover);
        document.documentElement.style.setProperty('--accent-light', theme.light);
      }

      let isInitialLoad = true;

      function subscribeCurrentRoom() {
        const curRoom = getCurrentRoom();
        if (!curRoom) return;
        isInitialLoad = true;

        const roomKey = getRoomFirebaseKey(curRoom);
        const purgeTime = curRoom.purgeTime || '00:00';
        const currentSessionDate = getSessionDateString(new Date(), purgeTime);

        if (db) {
          db.goOnline();

          if (activeFirebaseListenerKey) {
            db.ref(`rooms/${activeFirebaseListenerKey}/messages`).off();
            db.ref(`rooms/${activeFirebaseListenerKey}/members`).off();
            db.ref(`rooms/${activeFirebaseListenerKey}/lastRead`).off();
          }

          activeFirebaseListenerKey = roomKey;

          // 1. 相手の既読更新（レンダリングは差分更新のみ）
          db.ref(`rooms/${roomKey}/lastRead`).on('value', (snapshot) => {
            userLastReadTimes = snapshot.val() || {};
            updateReadBadgesOnly();
          });

          // 2. メッセージ受信
          db.ref(`rooms/${roomKey}/messages`).on('value', (snapshot) => {
            const data = snapshot.val();
            let allMsgs = data ? Object.values(data) : [];
            
            allMsgs.sort((a, b) => (a.timestampMs || 0) - (b.timestampMs || 0));

            const oldMsgIds = [];
            const validSessionMsgs = [];

            allMsgs.forEach(m => {
              const msgSessionDate = m.sessionDate || (m.timestampMs ? getSessionDateString(new Date(m.timestampMs), purgeTime) : null);
              if (msgSessionDate && msgSessionDate !== currentSessionDate) {
                oldMsgIds.push(m.id);
              } else {
                validSessionMsgs.push(m);
              }
            });

            const slicedMsgs = validSessionMsgs.slice(-50);

            if (oldMsgIds.length > 0) {
              oldMsgIds.forEach(id => {
                db.ref(`rooms/${roomKey}/messages/${id}`).remove();
              });
            }

            if (!isInitialLoad && slicedMsgs.length > currentMessages.length) {
              const latestMsg = slicedMsgs[slicedMsgs.length - 1];
              if (latestMsg.senderId !== myId && latestMsg.senderName !== appState.userName) {
                unreadCount++;
                updateBadgeUI();
                playNotificationSound();
                showDesktopNotification(latestMsg);
              } else {
                playNotificationSound();
              }
            }
            isInitialLoad = false;

            currentMessages = slicedMsgs;
            renderMessages(currentMessages);

            autoReadIfActive();
          });

          // 3. メンバー監視
          db.ref(`rooms/${roomKey}/members`).on('value', (snapshot) => {
            const data = snapshot.val();
            activeMembers = data || {};
            renderMembers();
          });
        }
      }

      function announcePresence() {
        const curRoom = getCurrentRoom();
        if (!curRoom) return;
        const displayName = appState.userName.trim() || 'メンバー';
        const avatar = displayName.charAt(0).toUpperCase();

        const roomKey = getRoomFirebaseKey(curRoom);

        const memberObj = {
          id: myId,
          name: displayName,
          avatarLetter: avatar,
          status: appState.userStatus,
          groupId: roomKey,
          timestamp: Date.now()
        };

        if (db) {
          const userRef = db.ref(`rooms/${roomKey}/members/${myId}`);
          userRef.set(memberObj);
          userRef.onDisconnect().remove();
        }

        activeMembers[myId] = memberObj;
        renderMembers();

        bc.postMessage({ type: 'PRESENCE_PING', member: memberObj });
      }

      function applyPinState(isPinned) {
        appState.isPinned = isPinned;
        if (isPinned) {
          chatContainer.classList.add('pinned');
          pinBtn.classList.add('active');
          pinBtn.title = "ピン留め中 (最前面固定)";
        } else {
          chatContainer.classList.remove('pinned');
          pinBtn.classList.remove('active');
          pinBtn.title = "最前面にピン留め (ON/OFF)";
        }
        saveState();
      }

      pinBtn.addEventListener('click', () => applyPinState(!appState.isPinned));

      popoutBtn.addEventListener('click', () => {
        const w = 340, h = 550, left = window.screen.width - w - 20, top = 40;
        window.open(window.location.href, 'MicroOfficeChatPopout', `width=${w},height=${h},left=${left},top=${top},resizable=yes`);
      });

      roomSelector.addEventListener('change', (e) => {
        appState.activeRoomId = e.target.value;
        saveState();
        applyRoomTheme();
        subscribeCurrentRoom();
        announcePresence();
      });

      configBtn.addEventListener('click', () => openConfigModal());

      function openConfigModal() {
        userNameInput.value = appState.userName;

        const curRoom = getCurrentRoom();
        if (curRoom) {
          editRoomSectionTitle.textContent = `✏️ 現在の部屋「${curRoom.name}」の設定変更`;
          editRoomNameInput.value = curRoom.name;
          editRoomIdInput.value = curRoom.id;
          editPasscodeInput.value = curRoom.passcode || '';
          editPurgeTimeSelect.value = curRoom.purgeTime || '00:00';
          selectedEditColorTheme = curRoom.color || 'indigo';

          editColorPickerOptions.querySelectorAll('.color-btn').forEach(btn => {
            if (btn.dataset.color === selectedEditColorTheme) {
              btn.classList.add('active');
            } else {
              btn.classList.remove('active');
            }
          });
        }

        renderSavedRoomsList();
        configModal.style.display = 'flex';
      }

      closeConfigModalBtn.addEventListener('click', () => {
        appState.userName = userNameInput.value.trim();
        saveState();
        configModal.style.display = 'none';
        announcePresence();
      });

      editColorPickerOptions.addEventListener('click', (e) => {
        if (e.target.classList.contains('color-btn')) {
          editColorPickerOptions.querySelectorAll('.color-btn').forEach(btn => btn.classList.remove('active'));
          e.target.classList.add('active');
          selectedEditColorTheme = e.target.dataset.color;
        }
      });

      saveCurrentRoomConfigBtn.addEventListener('click', () => {
        const curRoom = getCurrentRoom();
        if (!curRoom) return;

        const newName = editRoomNameInput.value.trim();
        const newPasscode = editPasscodeInput.value.trim();
        const newPurgeTime = editPurgeTimeSelect.value;

        if (!newName) {
          alert('部屋名を入力してください。');
          return;
        }

        curRoom.name = newName;
        curRoom.passcode = newPasscode;
        curRoom.purgeTime = newPurgeTime;
        curRoom.color = selectedEditColorTheme;

        appState.userName = userNameInput.value.trim();

        saveState();
        updateRoomSelectorUI();
        applyRoomTheme();
        configModal.style.display = 'none';

        subscribeCurrentRoom();
        announcePresence();
      });

      addRoomBtn.addEventListener('click', () => openAddRoomModal());

      function openAddRoomModal() {
        newRoomNameInput.value = '';
        newRoomIdInput.value = '';
        newPasscodeInput.value = '';
        newPurgeTimeSelect.value = '00:00';
        addRoomModal.style.display = 'flex';
      }

      closeAddRoomModalBtn.addEventListener('click', () => {
        addRoomModal.style.display = 'none';
      });

      addNewRoomConfirmBtn.addEventListener('click', () => {
        const name = newRoomNameInput.value.trim();
        const id = newRoomIdInput.value.trim();
        const passcode = newPasscodeInput.value.trim();
        const purgeTime = newPurgeTimeSelect.value;

        if (!name || !id) {
          alert('部屋名と部屋IDを入力してください。');
          return;
        }

        const existing = appState.rooms.find(r => r.id === id);
        if (!existing) {
          appState.rooms.push({ id, name, passcode, color: selectedEditColorTheme, purgeTime });
        } else {
          existing.name = name;
          existing.passcode = passcode;
          existing.color = selectedEditColorTheme;
          existing.purgeTime = purgeTime;
        }

        appState.activeRoomId = id;
        saveState();
        updateRoomSelectorUI();
        applyRoomTheme();

        newRoomNameInput.value = '';
        newRoomIdInput.value = '';
        newPasscodeInput.value = '';
        addRoomModal.style.display = 'none';

        subscribeCurrentRoom();
        announcePresence();
      });

      function renderSavedRoomsList() {
        savedRoomsList.innerHTML = '';
        appState.rooms.forEach(r => {
          const item = document.createElement('div');
          item.className = 'saved-room-item';
          const passcodeStr = r.passcode ? r.passcode : 'なし';
          const purgeTimeStr = r.purgeTime ? r.purgeTime : '00:00';
          item.innerHTML = `
            <div style="display:flex; flex-direction:column; gap:1px; min-width:0; flex:1;">
              <span>🏢 <strong>${escapeHTML(r.name)}</strong></span>
              <span style="font-size:8.5px; color:#94a3b8;">ID: <code>${escapeHTML(r.id)}</code> | 合言葉: <code>${escapeHTML(passcodeStr)}</code> | ⏰: ${escapeHTML(purgeTimeStr)}</span>
            </div>
            <div style="display:flex; gap:4px; align-items:center;">
              <button onclick="copyRoomInfo('${escapeHTML(r.id)}', '${escapeHTML(passcodeStr)}')" class="small-btn" title="招待用情報をコピー">📋 共有</button>
              ${appState.rooms.length > 1 ? `<button onclick="deleteRoom('${r.id}')" class="remove-room-btn">削除</button>` : ''}
            </div>
          `;
          savedRoomsList.appendChild(item);
        });
      }

      window.copyRoomInfo = function(roomId, passcode) {
        const text = `【Desk Chat 部屋参加情報】\n部屋ID: ${roomId}\n合言葉: ${passcode}`;
        navigator.clipboard.writeText(text).then(() => {
          alert('部屋IDと合言葉をコピーしました！\n新しいメンバーに共有してください。');
        });
      };

      window.deleteRoom = function(roomId) {
        if (confirm('この部屋リストから削除しますか？')) {
          appState.rooms = appState.rooms.filter(r => r.id !== roomId);
          if (appState.activeRoomId === roomId) {
            appState.activeRoomId = appState.rooms[0].id;
          }
          saveState();
          updateRoomSelectorUI();
          applyRoomTheme();
          renderSavedRoomsList();
          subscribeCurrentRoom();
          announcePresence();
        }
      };

      myStatusSelect.addEventListener('change', (e) => {
        appState.userStatus = e.target.value;
        saveState();
        announcePresence();
      });

      fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
          if (file.size > 8 * 1024 * 1024) {
            alert('ファイルサイズは8MB以下にしてください。');
            return;
          }
          const reader = new FileReader();
          reader.onload = (evt) => {
            attachedFile = { name: file.name, type: file.type, data: evt.target.result };
            fileNameDisplay.textContent = `📎 ${file.name}`;
            filePreview.style.display = 'flex';
          };
          reader.readAsDataURL(file);
        }
      });

      removeFileBtn.addEventListener('click', () => {
        attachedFile = null;
        fileInput.value = '';
        filePreview.style.display = 'none';
      });

      messageForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const text = messageInput.value.trim();
        if (!text && !attachedFile) return;

        sendMessage({ text, file: attachedFile });

        messageInput.value = '';
        attachedFile = null;
        fileInput.value = '';
        filePreview.style.display = 'none';
      });

      function bindStampButtons() {
        const btns = quickStampsArea.querySelectorAll('.stamp-btn');
        btns.forEach(btn => {
          btn.onclick = () => {
            sendMessage({ stamp: btn.dataset.stamp });
          };
        });
      }

      function sendMessage({ text, stamp, file }) {
        const curRoom = getCurrentRoom();
        if (!curRoom) return;
        const roomKey = getRoomFirebaseKey(curRoom);
        const purgeTime = curRoom.purgeTime || '00:00';

        const displayName = appState.userName.trim() || 'メンバー';
        const avatar = displayName.charAt(0).toUpperCase();
        const msgId = 'msg_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);
        const nowMs = Date.now();

        const msgObj = {
          id: msgId,
          senderId: myId,
          senderName: displayName,
          avatarLetter: avatar,
          text: text || '',
          stamp: stamp || null,
          file: file || null,
          timestamp: new Date(nowMs).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' }),
          timestampMs: nowMs,
          sessionDate: getSessionDateString(new Date(nowMs), purgeTime),
          groupId: roomKey
        };

        if (db) {
          db.ref(`rooms/${roomKey}/messages/${msgId}`).set(msgObj);
        } else {
          currentMessages.push(msgObj);
          renderSingleMessage(msgObj);
          scrollToBottom();
          playNotificationSound();
        }

        bc.postMessage({ type: 'NEW_MSG', msg: msgObj });
      }

      copyLogBtn.addEventListener('click', () => {
        const curRoom = getCurrentRoom();
        if (currentMessages.length === 0) {
          alert('コピーするログがありません。');
          return;
        }

        let textToCopy = `=== ${curRoom.name} チャット全ログ (${new Date().toLocaleDateString()}) ===\n\n`;
        currentMessages.forEach(m => {
          const content = m.stamp ? `[ ${m.stamp} ]` : m.text;
          textToCopy += `[${m.timestamp}] ${m.senderName}: ${content}\n`;
        });

        navigator.clipboard.writeText(textToCopy).then(() => {
          const orig = copyLogBtn.textContent;
          copyLogBtn.textContent = '✅ コピー完了!';
          setTimeout(() => copyLogBtn.textContent = orig, 2000);
        });
      });

      clearAllBtn.addEventListener('click', () => {
        if (confirm('この部屋のチャットログを一括全消去しますか？\n（オンラインの全員の画面からも削除されます）')) {
          const curRoom = getCurrentRoom();
          const roomKey = getRoomFirebaseKey(curRoom);
          if (db) {
            db.ref(`rooms/${roomKey}/messages`).remove();
          } else {
            currentMessages = [];
            renderMessages([]);
          }
          bc.postMessage({ type: 'CLEAR_ALL', groupId: roomKey });
        }
      });

      bc.onmessage = (e) => {
        const data = e.data;
        if (!data) return;

        const curRoom = getCurrentRoom();
        const roomKey = getRoomFirebaseKey(curRoom);

        if (data.type === 'NEW_MSG' && !db) {
          const msg = data.msg;
          if (msg.groupId === roomKey) {
            currentMessages.push(msg);
            renderSingleMessage(msg);
            scrollToBottom();
            playNotificationSound();
          }
          if (msg.senderName !== appState.userName) {
            unreadCount++;
            updateBadgeUI();
            showDesktopNotification(msg);
          }
        }
      };

      function renderMembers() {
        membersList.innerHTML = '';
        const curRoom = getCurrentRoom();
        const roomKey = getRoomFirebaseKey(curRoom);

        const displayName = appState.userName.trim() || 'メンバー';
        const myAvatar = displayName.charAt(0).toUpperCase();
        addAvatarBadge(myAvatar, `${displayName} (${appState.userStatus})`, true);

        Object.values(activeMembers).forEach(m => {
          if (m.id !== myId && m.groupId === roomKey) {
            addAvatarBadge(m.avatarLetter, `${m.name} (${m.status})`, true);
          }
        });
      }

      function addAvatarBadge(letter, titleText, isOnline) {
        const badge = document.createElement('div');
        badge.className = `avatar-badge ${isOnline ? 'online' : ''}`;
        badge.textContent = letter;
        badge.title = titleText;
        membersList.appendChild(badge);
      }

      function renderMessages(messages) {
        chatTimeline.innerHTML = '';
        if (messages.length === 0) {
          chatTimeline.innerHTML = `<div class="timeline-empty-notice">💬 まだメッセージはありません。<br>下のクイックボタンで声を掛けましょう！</div>`;
          return;
        }
        messages.forEach(m => renderSingleMessage(m));
        scrollToBottom();
      }

      // 画面全体を再クリアせず、既読バッジ部分だけを静かに更新（画面チラつき100%カット）
      function updateReadBadgesOnly() {
        currentMessages.forEach(msg => {
          const msgElem = document.getElementById(`msg_${msg.id}`);
          if (!msgElem) return;

          const footerInfo = msgElem.querySelector('.msg-footer-info');
          if (!footerInfo) return;

          const readUserNames = [];
          const msgTime = msg.timestampMs || 0;

          Object.values(userLastReadTimes).forEach(readInfo => {
            if (readInfo && readInfo.userId !== (msg.senderId || '')) {
              if (readInfo.userId !== myId && readInfo.readTime >= msgTime) {
                readUserNames.push(readInfo.userName || '相手');
              }
            }
          });

          const readCount = readUserNames.length;
          let statusBadge = footerInfo.querySelector('.msg-read-status');

          if (readCount > 0) {
            const names = readUserNames.join(', ');
            if (!statusBadge) {
              statusBadge = document.createElement('div');
              statusBadge.className = 'msg-read-status';
              footerInfo.insertBefore(statusBadge, footerInfo.firstChild);
            }
            statusBadge.textContent = `👀 既読 ${readCount}`;
            statusBadge.title = `既読: ${names}`;
          } else if (statusBadge) {
            statusBadge.remove();
          }
        });
      }

      function renderSingleMessage(msg) {
        const notice = chatTimeline.querySelector('.timeline-empty-notice');
        if (notice) notice.remove();

        const item = document.createElement('div');
        item.className = 'msg-item';
        item.id = `msg_${msg.id}`;

        let bodyContent = '';
        if (msg.stamp) {
          bodyContent = `<div class="msg-stamp">${escapeHTML(msg.stamp)}</div>`;
        } else if (msg.text) {
          bodyContent = `<div class="msg-text">${escapeHTML(msg.text)}</div>`;
        }

        if (msg.file) {
          if (msg.file.type.startsWith('image/')) {
            bodyContent += `<div style="margin-top:4px;"><img src="${msg.file.data}" style="max-width:100%; border-radius:4px;" /></div>`;
          } else {
            bodyContent += `<div style="margin-top:4px;"><a href="${msg.file.data}" download="${msg.file.name}" style="color:#818cf8; font-size:11px;">💾 ${escapeHTML(msg.file.name)}</a></div>`;
          }
        }

        const readUserNames = [];
        const msgTime = msg.timestampMs || 0;

        Object.values(userLastReadTimes).forEach(readInfo => {
          if (readInfo && readInfo.userId !== (msg.senderId || '')) {
            if (readInfo.userId !== myId && readInfo.readTime >= msgTime) {
              readUserNames.push(readInfo.userName || '相手');
            }
          }
        });
        
        const readCount = readUserNames.length;
        
        let readBadgeHTML = '';
        if (readCount > 0) {
          const names = readUserNames.join(', ');
          readBadgeHTML = `<div class="msg-read-status" title="既読: ${escapeHTML(names)}">👀 既読 ${readCount}</div>`;
        }

        item.innerHTML = `
          <div class="msg-avatar">${escapeHTML(msg.avatarLetter)}</div>
          <div class="msg-body">
            <div class="msg-header">
              <span class="msg-sender">${escapeHTML(msg.senderName)}</span>
              <span class="msg-time">${msg.timestamp}</span>
            </div>
            ${bodyContent}
            <div class="msg-footer-info">
              ${readBadgeHTML}
              <button class="msg-delete-btn" onclick="deleteSingleMsg('${msg.id}')" title="削除">✕</button>
            </div>
          </div>
        `;

        chatTimeline.appendChild(item);
      }

      window.deleteSingleMsg = function(msgId) {
        const curRoom = getCurrentRoom();
        const roomKey = getRoomFirebaseKey(curRoom);
        if (db) {
          db.ref(`rooms/${roomKey}/messages/${msgId}`).remove();
        } else {
          currentMessages = currentMessages.filter(m => m.id !== msgId);
          renderMessages(currentMessages);
        }
      };

      function scrollToBottom() {
        chatTimeline.scrollTop = chatTimeline.scrollHeight;
      }

      function showDesktopNotification(msg) {
        if ('Notification' in window && Notification.permission !== 'granted' && Notification.permission !== 'denied') {
          Notification.requestPermission();
        }
        if ('Notification' in window && Notification.permission === 'granted') {
          const curRoom = getCurrentRoom();
          const n = new Notification(`⚡ [${curRoom.name}] ${msg.senderName}さんからの声掛け`, {
            body: msg.stamp || msg.text || 'ファイルが届きました',
            icon: '/favicon.ico'
          });
          n.onclick = () => {
            window.focus();
            markCurrentMessagesAsRead();
          };
        }
      }

      function escapeHTML(str) {
        return (str || '').replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
      }

      init();
      setInterval(announcePresence, 5000);
      setInterval(autoReadIfActive, 4000);
    });
  </script>
</body>
</html>
