<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Desk Chat (デスクチャット)</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css?v=20260816_1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- Firebase SDKs (v9 Compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <!-- PeerJS WebRTC Library -->
  <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
</head>
<body>

  <!-- 超コンパクトメインウィンドウ container -->
  <div class="chat-container" id="chatContainer">
    
    <!-- ウルトラコンパクトヘッダー -->
    <header class="app-header" id="dragHeader">
      <div class="header-title">
        <span class="app-icon" id="roomThemeIcon">💬</span>
        <span class="app-name" id="currentRoomTitle">Desk Chat</span>
        <span id="roomKeyTag" style="font-size:8px; opacity:0.6; margin-left:4px; font-weight:normal;"></span>
      </div>
      <div class="header-actions">
        <button id="vcToggleBtn" class="vc-join-btn" title="ルーム別ボイスチャットに参加">🎤 VC</button>
        <button id="soundToggleBtn" class="icon-btn active" title="通知音 (ON/OFF)">🔊</button>
        <button id="pinBtn" class="icon-btn" title="最前面にピン留め (ON/OFF)">📌</button>
        <button id="configBtn" class="icon-btn" title="現在の部屋の設定・変更">⚙️</button>
        <button id="popoutBtn" class="icon-btn" title="小窓ポップアップ表示">↗️</button>
      </div>
    </header>

    <!-- 部屋切り替えドロップダウン & 追加ボタン -->
    <nav class="group-select-bar">
      <div class="select-wrapper">
        <span class="room-icon">🏢</span>
        <select id="roomSelector" title="部屋の切り替え"></select>
      </div>
      <button id="addRoomBtn" class="small-add-btn" title="新しい部屋を追加">＋部屋追加</button>
    </nav>

    <!-- メンバーのオンライン在席表示バー (先頭1文字アバター) -->
    <section class="members-bar">
      <div class="members-label">メンバー (在席):</div>
      <div class="members-list" id="membersList"></div>
    </section>

    <!-- 🎙️ ボイスチャット (VC) コントロールバー (参加時のみ表示) -->
    <section class="vc-bar" id="vcControlBar" style="display: none;">
      <div style="display:flex; align-items:center; gap:4px;">
        <span style="color:#10b981; font-weight:bold;">🟢 VC接続中</span>
        <button id="vcMuteBtn" class="small-btn" style="padding:2px 6px;" title="マイクMute切替">🎙️ ON</button>
      </div>
      <div class="vc-controls">
        <div class="vc-slider-group" title="マイク入力マスター音量">
          <span>🎤入力</span>
          <input type="range" id="vcInputVol" min="0" max="150" value="100">
        </div>
        <div class="vc-slider-group" title="スピーカー出力マスター音量">
          <span>🔊出力</span>
          <input type="range" id="vcOutputVol" min="0" max="100" value="100">
        </div>
        <button id="vcLeaveBtn" class="small-btn danger-btn" style="padding:2px 6px;" title="VCを退出">🚪 退出</button>
      </div>
    </section>

    <!-- ツールバー (ログクリア 🧹 / コピー 📋 / ステータス変更) -->
    <section class="toolbar">
      <div class="status-selector">
        <label for="myStatus">自ステータス:</label>
        <select id="myStatus">
          <option value="🟢 在席">🟢 在席</option>
          <option value="🏃 離席中">🏃 離席中</option>
          <option value="📞 会議中">📞 会議中</option>
          <option value="🍱 休憩中">🍱 休憩中</option>
        </select>
      </div>
      <div class="tool-actions">
        <button id="copyLogBtn" class="small-btn" title="チャットログを全コピー">📋 コピー</button>
        <button id="clearAllBtn" class="small-btn danger-btn" title="チャットログを一括全消去">🧹 消去</button>
      </div>
    </section>

    <!-- チャットタイムライン表示エリア -->
    <main class="chat-timeline" id="chatTimeline">
      <div class="timeline-empty-notice" id="emptyNotice">
        💬 まだメッセージはありません。<br>下のクイックボタンで声を掛けましょう！
      </div>
    </main>

    <!-- ワンタップ・クイック声掛けリアクションボタン -->
    <section class="quick-stamps" id="quickStampsArea">
      <!-- 上段 -->
      <button class="stamp-btn" data-stamp="〇 承知いたしました">〇 承知いたしました</button>
      <button class="stamp-btn" data-stamp="✕ 申し訳ございません">✕ 申し訳ございません</button>
      <button class="stamp-btn" data-stamp="🤔 少し考えます">🤔 少し考えます</button>
      <!-- 下段 -->
      <button class="stamp-btn" data-stamp="👀 確認いたします">👀 確認いたします</button>
      <button class="stamp-btn" data-stamp="📞 後で連絡します">📞 後で連絡します</button>
      <button class="stamp-btn" data-stamp="📞 連絡いただきたい">📞 連絡いただきたい</button>
    </section>

    <!-- 入力フォーム ＋ ファイル添付 -->
    <footer class="chat-input-area">
      <div class="file-attachment-preview" id="filePreview" style="display: none;">
        <span id="fileNameDisplay">file.png</span>
        <button id="removeFileBtn" class="remove-file-btn">✕</button>
      </div>
      <form id="messageForm" class="input-form">
        <label for="fileInput" class="file-attach-btn" title="ファイル・画像を添付">📎
          <input type="file" id="fileInput" style="display: none;">
        </label>
        <input type="text" id="messageInput" placeholder="ちょっとしたメッセージ..." autocomplete="off">
        <button type="submit" class="send-btn" id="sendBtn">送信</button>
      </form>
    </footer>

  </div>

  <!-- 【🖼️ 画像拡大 ライトボックス モーダル】 -->
  <div class="lightbox-overlay" id="lightboxModal" style="display: none;">
    <img src="" id="lightboxImg" class="lightbox-img" alt="拡大プレビュー">
  </div>

  <!-- 【⚙️ 設定モーダル】：現在の部屋の編集・確認 -->
  <div class="modal-overlay" id="configModal" style="display: none;">
    <div class="modal-card">
      <h3>⚙️ 設定 ＆ ユーザープロフィール</h3>
      
      <div class="form-group">
        <label for="userNameInput">氏名 (フルネーム/苗字):</label>
        <input type="text" id="userNameInput" placeholder="例: 河合 雅">
        <small>※メンバー一覧のマウスオーバー時などに表示されます。</small>
      </div>

      <div class="form-group">
        <label for="userAvatarCharInput">アイコン表示文字 (1文字):</label>
        <input type="text" id="userAvatarCharInput" maxlength="2" placeholder="例: 雅 または K" style="width:100px;">
        <small>※アイコンの中に表示する好きな1文字（空欄の場合は氏名の頭文字）。</small>
      </div>

      <div class="form-group">
        <label>🔷 アバターの形状 (アイコンの形):</label>
        <div class="shape-picker-options" id="avatarShapeOptions" style="display:flex; gap:8px; margin-top:4px;">
          <button type="button" class="small-btn shape-option-btn active" data-shape="shape-circle" title="〇 丸型">〇 丸</button>
          <button type="button" class="small-btn shape-option-btn" data-shape="shape-square" title="□ 四角型">□ 四角</button>
          <button type="button" class="small-btn shape-option-btn" data-shape="shape-hexagon" title="⬡ 六角型">⬡ 六角</button>
          <button type="button" class="small-btn shape-option-btn" data-shape="shape-diamond" title="◆ ダイヤ型">◆ ダイヤ</button>
        </div>
      </div>

      <hr>

      <!-- 現在開いている部屋の編集・確認セクション -->
      <h4 id="editRoomSectionTitle">✏️ 現在の部屋の設定変更</h4>
      <div class="form-group">
        <label for="editRoomNameInput">部屋名:</label>
        <input type="text" id="editRoomNameInput" placeholder="部屋の名前">
      </div>
      <div class="form-group">
        <label for="editRoomIdInput">部屋ID (部屋IDは編集できません):</label>
        <input type="text" id="editRoomIdInput" disabled style="opacity:0.7; cursor:not-allowed;">
      </div>
      <div class="form-group">
        <label for="editPasscodeInput">合言葉 (パスコード):</label>
        <input type="text" id="editPasscodeInput" placeholder="例: 1234 (空欄可)">
      </div>

      <div class="form-group">
        <label for="editPurgeTimeSelect">⏰ 毎日の自動ログクリア時刻:</label>
        <select id="editPurgeTimeSelect">
          <option value="00:00">00:00 (深夜0時・デフォルト)</option>
          <option value="01:00">01:00 (深夜1時)</option>
          <option value="02:00">02:00 (深夜2時)</option>
          <option value="03:00">03:00 (深夜3時)</option>
          <option value="04:00">04:00 (早朝4時)</option>
          <option value="05:00">05:00 (早朝5時)</option>
          <option value="06:00">06:00 (朝6時)</option>
          <option value="07:00">07:00 (朝7時)</option>
          <option value="08:00">08:00 (朝8時)</option>
          <option value="09:00">09:00 (朝9時)</option>
          <option value="12:00">12:00 (正午)</option>
          <option value="18:00">18:00 (夕方6時)</option>
          <option value="21:00">21:00 (夜9時)</option>
        </select>
      </div>

      <div class="form-group">
        <label>🎨 My テーマカラー (個人用カラー):</label>
        <div class="color-picker-options" id="editColorPickerOptions">
          <button type="button" class="color-btn" data-color="indigo" style="background: #6366f1;" title="インディゴ"></button>
          <button type="button" class="color-btn" data-color="emerald" style="background: #10b981;" title="エメラルドグリーン"></button>
          <button type="button" class="color-btn" data-color="purple" style="background: #8b5cf6;" title="パープル"></button>
          <button type="button" class="color-btn" data-color="rose" style="background: #f43f5e;" title="ローズレッド"></button>
          <button type="button" class="color-btn" data-color="amber" style="background: #f59e0b;" title="アンバーオレンジ"></button>
          <button type="button" class="color-btn" data-color="cyan" style="background: #06b6d4;" title="シアンブルー"></button>
        </div>
      </div>

      <button id="saveCurrentRoomConfigBtn" class="primary-btn" style="width: 100%; margin-top: 4px; margin-bottom: 8px;">💾 設定を更新して保存</button>

      <hr>

      <h4>📋 参加中の部屋一覧（ID・合言葉・共有）</h4>
      <div id="savedRoomsList" class="saved-rooms-list"></div>

      <div class="modal-actions" style="justify-content: space-between;">
        <button id="resetStateBtn" class="danger-btn small-btn" style="padding: 4px 8px;">🗑️ 登録名をリセット</button>
        <button id="closeConfigModalBtn" class="secondary-btn">閉じる</button>
      </div>
    </div>
  </div>

  <!-- 【＋部屋追加 モーダル】：新規部屋の作成・参加 -->
  <div class="modal-overlay" id="addRoomModal" style="display: none;">
    <div class="modal-card">
      <h3>➕ 新しい部屋を作成・参加する</h3>
      
      <div class="form-group">
        <label for="newRoomNameInput">部屋名 (例: 営業チーム, プロジェクトA):</label>
        <input type="text" id="newRoomNameInput" placeholder="部屋の名前を入力">
      </div>
      <div class="form-group">
        <label for="newRoomIdInput">部屋ID (英数字・共有用ID):</label>
        <input type="text" id="newRoomIdInput" placeholder="例: room-01">
      </div>
      <div class="form-group">
        <label for="newPasscodeInput">合言葉 (パスコード):</label>
        <input type="text" id="newPasscodeInput" placeholder="例: 1234 (空欄可)">
      </div>
      <div class="form-group">
        <label for="newPurgeTimeSelect">⏰ 毎日の自動ログクリア時刻:</label>
        <select id="newPurgeTimeSelect">
          <option value="00:00" selected>00:00 (深夜0時・デフォルト)</option>
          <option value="01:00">01:00 (深夜1時)</option>
          <option value="05:00">05:00 (早朝5時)</option>
          <option value="09:00">09:00 (朝9時)</option>
          <option value="12:00">12:00 (正午)</option>
          <option value="18:00">18:00 (夕方6時)</option>
        </select>
      </div>
      
      <div class="modal-actions" style="justify-content: space-between; margin-top: 12px;">
        <button id="closeAddRoomModalBtn" class="secondary-btn">キャンセル</button>
        <button id="addNewRoomConfirmBtn" class="primary-btn">＋ 部屋を作成して移動</button>
      </div>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(registrations => {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }

    const firebaseConfig = {
      apiKey: "AIzaSyDTcSTgVeVYix7oJiPVfNXqH3QtNzuduuM",
      authDomain: "micro-chat-c25bb.firebaseapp.com",
      projectId: "micro-chat-c25bb",
      storageBucket: "micro-chat-c25bb.firebasestorage.app",
      messagingSenderId: "384583388483",
      appId: "1:384583388483:web:7c6dfe83100b89e1efb3f6",
      measurementId: "G-3TRBLWK51N",
      databaseURL: "https://micro-chat-c25bb-default-rtdb.firebaseio.com"
    };

    let db = null;
    try {
      if (typeof firebase !== 'undefined') {
        firebase.initializeApp(firebaseConfig);
        db = firebase.database();
      }
    } catch (e) {
      console.warn("Firebase Init fallback to BroadcastChannel:", e);
    }

    document.addEventListener('DOMContentLoaded', () => {
      const bc = new BroadcastChannel('micro_office_chat_channel');

      const chatContainer = document.getElementById('chatContainer');
      const soundToggleBtn = document.getElementById('soundToggleBtn');
      const pinBtn = document.getElementById('pinBtn');
      const configBtn = document.getElementById('configBtn');
      const popoutBtn = document.getElementById('popoutBtn');
      const roomSelector = document.getElementById('roomSelector');
      const addRoomBtn = document.getElementById('addRoomBtn');
      const currentRoomTitle = document.getElementById('currentRoomTitle');
      const roomKeyTag = document.getElementById('roomKeyTag');
      const membersList = document.getElementById('membersList');
      const myStatusSelect = document.getElementById('myStatus');
      const copyLogBtn = document.getElementById('copyLogBtn');
      const clearAllBtn = document.getElementById('clearAllBtn');
      const chatTimeline = document.getElementById('chatTimeline');
      const messageForm = document.getElementById('messageForm');
      const messageInput = document.getElementById('messageInput');
      const fileInput = document.getElementById('fileInput');
      const filePreview = document.getElementById('filePreview');
      const fileNameDisplay = document.getElementById('fileNameDisplay');
      const removeFileBtn = document.getElementById('removeFileBtn');
      const quickStampsArea = document.getElementById('quickStampsArea');

      // VC 関連 DOM
      const vcToggleBtn = document.getElementById('vcToggleBtn');
      const vcControlBar = document.getElementById('vcControlBar');
      const vcMuteBtn = document.getElementById('vcMuteBtn');
      const vcInputVol = document.getElementById('vcInputVol');
      const vcOutputVol = document.getElementById('vcOutputVol');
      const vcLeaveBtn = document.getElementById('vcLeaveBtn');

      const lightboxModal = document.getElementById('lightboxModal');
      const lightboxImg = document.getElementById('lightboxImg');

      const configModal = document.getElementById('configModal');
      const userNameInput = document.getElementById('userNameInput');
      const userAvatarCharInput = document.getElementById('userAvatarCharInput');
      const avatarShapeOptions = document.getElementById('avatarShapeOptions');
      const editRoomSectionTitle = document.getElementById('editRoomSectionTitle');
      const editRoomNameInput = document.getElementById('editRoomNameInput');
      const editRoomIdInput = document.getElementById('editRoomIdInput');
      const editPasscodeInput = document.getElementById('editPasscodeInput');
      const editPurgeTimeSelect = document.getElementById('editPurgeTimeSelect');
      const editColorPickerOptions = document.getElementById('editColorPickerOptions');
      const saveCurrentRoomConfigBtn = document.getElementById('saveCurrentRoomConfigBtn');
      const savedRoomsList = document.getElementById('savedRoomsList');
      const closeConfigModalBtn = document.getElementById('closeConfigModalBtn');
      const resetStateBtn = document.getElementById('resetStateBtn');

      const addRoomModal = document.getElementById('addRoomModal');
      const newRoomNameInput = document.getElementById('newRoomNameInput');
      const newRoomIdInput = document.getElementById('newRoomIdInput');
      const newPasscodeInput = document.getElementById('newPasscodeInput');
      const newPurgeTimeSelect = document.getElementById('newPurgeTimeSelect');
      const addNewRoomConfirmBtn = document.getElementById('addNewRoomConfirmBtn');
      const closeAddRoomModalBtn = document.getElementById('closeAddRoomModalBtn');

      let selectedEditColorTheme = 'indigo';
      let selectedAvatarShape = 'shape-circle';
      let isSoundEnabled = true;
      let unreadCount = 0;

      let appState = JSON.parse(localStorage.getItem('micro_office_chat_state'));
      if (appState && appState.userName === '山田') {
        appState.userName = '';
        localStorage.setItem('micro_office_chat_state', JSON.stringify(appState));
      }

      if (!appState) {
        appState = {
          userName: '',
          userAvatarChar: '',
          userStatus: '🟢 在席',
          activeRoomId: 'room1',
          avatarShape: 'shape-circle',
          rooms: [
            { id: 'room1', name: 'トークルーム1', passcode: '', color: 'indigo', purgeTime: '00:00' }
          ],
          isPinned: false
        };
      }

      if (!appState.avatarShape) appState.avatarShape = 'shape-circle';
      selectedAvatarShape = appState.avatarShape;

      let myId = localStorage.getItem('micro_office_chat_uid');
      if (!myId) {
        myId = 'u_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
        localStorage.setItem('micro_office_chat_uid', myId);
      }

      let activeMembers = {};
      let userLastReadTimes = {};
      let attachedFile = null;
      let currentMessages = [];
      let currentSubscribedRef = null;
      let currentLatestMsgRef = null;
      let currentLastReadRef = null;
      let currentMembersRef = null;

      // ==========================================
      // 🎙️ ボイスチャット (VC) WebRTC エンジン
      // ==========================================
      let peer = null;
      let localStream = null;
      let isVcConnected = false;
      let isMicMuted = false;
      let peerCalls = {};
      let remoteAudioElements = {};
      let vcMembersRef = null;
      let vcMembers = {};
      let audioCtx = null;
      let inputGainNode = null;
      let outputGainNode = null;
      let localAnalyser = null;

      function initWebAudio() {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          inputGainNode = audioCtx.createGain();
          outputGainNode = audioCtx.createGain();
          inputGainNode.gain.value = (parseFloat(vcInputVol.value) || 100) / 100;
          outputGainNode.gain.value = (parseFloat(vcOutputVol.value) || 100) / 100;
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      }

      vcToggleBtn.addEventListener('click', () => {
        if (isVcConnected) {
          leaveVc();
        } else {
          joinVc();
        }
      });

      vcMuteBtn.addEventListener('click', () => {
        if (!localStream) return;
        isMicMuted = !isMicMuted;
        localStream.getAudioTracks().forEach(track => track.enabled = !isMicMuted);
        if (isMicMuted) {
          vcMuteBtn.textContent = '🔇 MUTE';
          vcMuteBtn.style.background = '#f43f5e';
          vcMuteBtn.style.color = '#ffffff';
        } else {
          vcMuteBtn.textContent = '🎙️ ON';
          vcMuteBtn.style.background = '';
          vcMuteBtn.style.color = '';
        }
      });

      vcInputVol.addEventListener('input', (e) => {
        const val = parseFloat(e.target.value) / 100;
        if (inputGainNode) inputGainNode.gain.value = val;
      });

      vcOutputVol.addEventListener('input', (e) => {
        const val = parseFloat(e.target.value) / 100;
        if (outputGainNode) outputGainNode.gain.value = val;
        Object.values(remoteAudioElements).forEach(audio => {
          audio.volume = Math.min(1.0, val);
        });
      });

      vcLeaveBtn.addEventListener('click', () => leaveVc());

      async function joinVc() {
        initWebAudio();
        const curRoom = getCurrentRoom();
        if (!curRoom) return;
        const roomKey = getRoomFirebaseKey(curRoom);

        try {
          localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        } catch (err) {
          alert('マイクのアクセスが拒否されたか、マイクが見つかりません。');
          return;
        }

        // Web Audio API によるマイク感度ゲイン接続
        try {
          const source = audioCtx.createMediaStreamSource(localStream);
          localAnalyser = audioCtx.createAnalyser();
          source.connect(inputGainNode);
          source.connect(localAnalyser);
          startSpeakingDetector();
        } catch (e) {}

        const peerIdStr = `deskchat_${roomKey}_${myId}`;
        
        peer = new Peer(peerIdStr, {
          debug: 0
        });

        peer.on('open', (id) => {
          isVcConnected = true;
          vcToggleBtn.classList.add('active');
          vcToggleBtn.textContent = '🎙️ VC接続中';
          vcControlBar.style.display = 'flex';

          if (db) {
            db.ref(`rooms/${roomKey}/vc_members/${myId}`).set({
              userId: myId,
              peerId: id,
              name: appState.userName || 'メンバー',
              joinedAt: Date.now()
            });
            db.ref(`rooms/${roomKey}/vc_members/${myId}`).onDisconnect().remove();
          }

          // 他の既に参加しているメンバーへ発信
          connectToOtherVcPeers(roomKey);
        });

        // 着信の受領
        peer.on('call', (call) => {
          call.answer(localStream);
          handlePeerStream(call);
        });

        peer.on('error', (err) => {
          console.warn("PeerJS error:", err);
        });

        // 部屋内のVCメンバーリストを監視
        if (db) {
          vcMembersRef = db.ref(`rooms/${roomKey}/vc_members`);
          vcMembersRef.on('value', (snapshot) => {
            vcMembers = snapshot.val() || {};
            if (isVcConnected) {
              connectToOtherVcPeers(roomKey);
            }
          });
        }
      }

      function connectToOtherVcPeers(roomKey) {
        Object.values(vcMembers).forEach(member => {
          if (member.userId !== myId && member.peerId && !peerCalls[member.peerId]) {
            const call = peer.call(member.peerId, localStream);
            if (call) {
              handlePeerStream(call);
            }
          }
        });
      }

      function handlePeerStream(call) {
        peerCalls[call.peer] = call;

        call.on('stream', (remoteStream) => {
          if (!remoteAudioElements[call.peer]) {
            const audio = new Audio();
            audio.srcObject = remoteStream;
            audio.autoplay = true;
            audio.volume = Math.min(1.0, (parseFloat(vcOutputVol.value) || 100) / 100);
            remoteAudioElements[call.peer] = audio;
          }
        });

        call.on('close', () => {
          if (remoteAudioElements[call.peer]) {
            remoteAudioElements[call.peer].pause();
            delete remoteAudioElements[call.peer];
          }
          delete peerCalls[call.peer];
        });
      }

      function startSpeakingDetector() {
        if (!localAnalyser) return;
        const dataArray = new Uint8Array(localAnalyser.frequencyBinCount);

        function checkVolume() {
          if (!isVcConnected) return;
          localAnalyser.getByteFrequencyData(dataArray);
          let sum = 0;
          for (let i = 0; i < dataArray.length; i++) {
            sum += dataArray[i];
          }
          const average = sum / dataArray.length;
          const myBadge = membersList.querySelector('.avatar-badge');

          if (average > 25 && !isMicMuted) {
            if (myBadge) myBadge.classList.add('speaking');
          } else {
            if (myBadge) myBadge.classList.remove('speaking');
          }

          requestAnimationFrame(checkVolume);
        }
        checkVolume();
      }

      function leaveVc() {
        const curRoom = getCurrentRoom();
        if (curRoom && db) {
          const roomKey = getRoomFirebaseKey(curRoom);
          db.ref(`rooms/${roomKey}/vc_members/${myId}`).remove();
          if (vcMembersRef) vcMembersRef.off();
        }

        Object.values(peerCalls).forEach(call => call.close());
        peerCalls = {};

        Object.values(remoteAudioElements).forEach(audio => {
          audio.pause();
          audio.srcObject = null;
        });
        remoteAudioElements = {};

        if (localStream) {
          localStream.getTracks().forEach(track => track.stop());
          localStream = null;
        }

        if (peer) {
          peer.destroy();
          peer = null;
        }

        isVcConnected = false;
        isMicMuted = false;
        vcMuteBtn.textContent = '🎙️ ON';
        vcMuteBtn.style.background = '';

        vcToggleBtn.textContent = '🎤 VC';

      function getSessionDateString(dateObj, purgeTimeStr) {
        const d = new Date(dateObj || Date.now());
        const [targetHour, targetMin] = (purgeTimeStr || '00:00').split(':').map(Number);
        
        if (d.getHours() < targetHour || (d.getHours() === targetHour && d.getMinutes() < targetMin)) {
          d.setDate(d.getDate() - 1);
        }
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      }

      function getRoomFirebaseKey(room) {

      function startAutoSyncTimer() {

      function fetchLatestMessagesManual() {
        const curRoom = getCurrentRoom();
        if (!curRoom || !db) return;
        const roomKey = getRoomFirebaseKey(curRoom);
        const purgeTime = curRoom.purgeTime || '00:00';
        const currentSessionDate = getSessionDateString(new Date(), purgeTime);

        db.ref(`rooms/${roomKey}/messages`).limitToLast(50).get().then((snapshot) => {
          if (!snapshot.exists()) return;
          const data = snapshot.val();
          let allMsgs = data ? Object.values(data) : [];
          allMsgs.sort((a, b) => (a.timestampMs || 0) - (b.timestampMs || 0));

          const validSessionMsgs = allMsgs.filter(m => {
            const msgSessionDate = m.sessionDate || (m.timestampMs ? getSessionDateString(new Date(m.timestampMs), purgeTime) : null);
            return !msgSessionDate || msgSessionDate === currentSessionDate;
          });

          const isChanged = (validSessionMsgs.length !== currentMessages.length) ||
                            (validSessionMsgs.length > 0 && currentMessages.length > 0 &&
                             validSessionMsgs[validSessionMsgs.length - 1].id !== currentMessages[currentMessages.length - 1].id);

          if (isChanged) {
            if (currentMessages.length > 0 && validSessionMsgs.length > currentMessages.length) {
              const latestMsg = validSessionMsgs[validSessionMsgs.length - 1];
              if (latestMsg.senderId !== myId && latestMsg.senderName !== appState.userName) {
                unreadCount++;
                updateBadgeUI();
                playNotificationSound();
                showDesktopNotification(latestMsg);
              }
            }
            currentMessages = validSessionMsgs;
            renderMessages(currentMessages);
          }
        }).catch(() => {});
      }

      function playNotificationSound() {
        if (!isSoundEnabled) return;
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          
          osc.type = 'sine';
          osc.frequency.setValueAtTime(587.33, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.15);
          
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);

          osc.connect(gain);
          gain.connect(ctx.destination);
          
          osc.start();
          osc.stop(ctx.currentTime + 0.3);
        } catch (e) {
          console.warn("Sound play error:", e);
        }
      }

        const colorMap = {

          emerald: { accent: '#10b981', hover: '#059669', light: 'rgba(16, 185, 129, 0.15)' },
          purple: { accent: '#8b5cf6', hover: '#7c3aed', light: 'rgba(139, 92, 246, 0.15)' },

      }

      let isInitialLoad = true;

      function subscribeCurrentRoom() {
        const curRoom = getCurrentRoom();
        if (!curRoom) return;
        isInitialLoad = true;

        // 部屋切り替え時は自動的に現在のVCから退出（部屋貫通100%防止）
        if (isVcConnected) {
          leaveVc();
        }

        const roomKey = getRoomFirebaseKey(curRoom);
        const purgeTime = curRoom.purgeTime || '00:00';
        const currentSessionDate = getSessionDateString(new Date(), purgeTime);

        if (db) {
          db.goOnline();

          if (currentSubscribedRef) currentSubscribedRef.off();
          if (currentLatestMsgRef) currentLatestMsgRef.off();
          if (currentLastReadRef) currentLastReadRef.off();
          if (currentMembersRef) currentMembersRef.off();

          currentLastReadRef = db.ref(`rooms/${roomKey}/lastRead`);
          currentLastReadRef.on('value', (snapshot) => {
            userLastReadTimes = snapshot.val() || {};
            updateReadBadgesOnly();
          });

          currentLatestMsgRef = db.ref(`rooms/${roomKey}/latestMsg`);
          currentLatestMsgRef.on('value', (snapshot) => {
            const latestObj = snapshot.val();
            if (latestObj && latestObj.id) {
              if (!currentMessages.some(m => m.id === latestObj.id)) {
                currentMessages.push(latestObj);
                currentMessages.sort((a, b) => (a.timestampMs || 0) - (b.timestampMs || 0));
                renderSingleMessage(latestObj);
                scrollToBottom();

                if (!isInitialLoad) {
                  if (latestObj.senderId !== myId && latestObj.senderName !== appState.userName) {
                    unreadCount++;
                    updateBadgeUI();
                    playNotificationSound();
                    showDesktopNotification(latestObj);
                  }
                }
              }
            } else if (latestObj === null) {
              currentMessages = [];
              renderMessages([]);
            }
          });

          currentSubscribedRef = db.ref(`rooms/${roomKey}/messages`).limitToLast(50);
          currentSubscribedRef.on('value', (snapshot) => {
            const data = snapshot.val();
            let allMsgs = data ? Object.values(data) : [];

            allMsgs.sort((a, b) => (a.timestampMs || 0) - (b.timestampMs || 0));

            const oldMsgIds = [];
            const validSessionMsgs = [];

            allMsgs.forEach(m => {
              const msgSessionDate = m.sessionDate || (m.timestampMs ? getSessionDateString(new Date(m.timestampMs), purgeTime) : null);
              if (msgSessionDate && msgSessionDate !== currentSessionDate) {
                oldMsgIds.push(m.id);
              } else {
                validSessionMsgs.push(m);
              }
            });

            if (oldMsgIds.length > 0) {
              oldMsgIds.forEach(id => {
                db.ref(`rooms/${roomKey}/messages/${id}`).remove();
              });
            }

            if (!isInitialLoad && validSessionMsgs.length > currentMessages.length) {
              const latestMsg = validSessionMsgs[validSessionMsgs.length - 1];
              if (latestMsg.senderId !== myId && latestMsg.senderName !== appState.userName) {
                unreadCount++;
                updateBadgeUI();
                playNotificationSound();
                showDesktopNotification(latestMsg);
              }
            }
            isInitialLoad = false;

            currentMessages = validSessionMsgs;
            renderMessages(currentMessages);

            if (document.visibilityState === 'visible' && document.hasFocus()) {
              markCurrentMessagesAsRead();
            }
          });

          currentMembersRef = db.ref(`rooms/${roomKey}/members`);
          currentMembersRef.on('value', (snapshot) => {
            const data = snapshot.val();
            activeMembers = data || {};
            renderMembers();
          });
        }
      }

        bc.postMessage({ type: 'PRESENCE_PING', member: memberObj });

      function bindStampButtons() {
        const btns = quickStampsArea.querySelectorAll('.stamp-btn');
        btns.forEach(btn => {
          btn.onclick = () => {
            sendMessage({ stamp: btn.dataset.stamp });
          };
        });
      }

      function sendMessage({ text, stamp, file }) {
        const curRoom = getCurrentRoom();
        if (!curRoom) return;
        const roomKey = getRoomFirebaseKey(curRoom);
        const purgeTime = curRoom.purgeTime || '00:00';

        const displayName = (appState.userName || '').trim() || 'メンバー';
        const customAvatarChar = (appState.userAvatarChar || '').trim();
        const avatar = customAvatarChar ? customAvatarChar.charAt(0) : displayName.charAt(0).toUpperCase();

        const msgId = 'msg_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);
        const nowMs = Date.now();

        const msgObj = {
          id: msgId,
          senderId: myId,
          senderName: displayName,
          avatarLetter: avatar,
          avatarShape: selectedAvatarShape,
          text: text || '',
          stamp: stamp || null,
          file: file || null,
          timestamp: new Date(nowMs).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' }),
          timestampMs: nowMs,
          sessionDate: getSessionDateString(new Date(nowMs), purgeTime),
          groupId: roomKey
        };

        if (db) {
          db.ref(`rooms/${roomKey}/messages/${msgId}`).set(msgObj);
          db.ref(`rooms/${roomKey}/latestMsg`).set(msgObj);
        } else {
          currentMessages.push(msgObj);
          renderSingleMessage(msgObj);
          scrollToBottom();
          playNotificationSound();
        }

        bc.postMessage({ type: 'NEW_MSG', msg: msgObj });
      }

      copyLogBtn.addEventListener('click', () => {
        const curRoom = getCurrentRoom();
        if (currentMessages.length === 0) {
          alert('コピーするログがありません。');
          return;
        }

        let textToCopy = `=== ${curRoom.name} チャット全ログ (${new Date().toLocaleDateString()}) ===\n\n`;
        currentMessages.forEach(m => {
          const content = m.stamp ? `[ ${m.stamp} ]` : m.text;
          textToCopy += `[${m.timestamp}] ${m.senderName}: ${content}\n`;
        });

        navigator.clipboard.writeText(textToCopy).then(() => {
          const orig = copyLogBtn.textContent;
          copyLogBtn.textContent = '✅ コピー完了!';
          setTimeout(() => copyLogBtn.textContent = orig, 2000);
        });
      });

      clearAllBtn.addEventListener('click', () => {
        if (confirm('この部屋のチャットログを一括全消去しますか？\n（オンラインの全員の画面からも削除されます）')) {
          const curRoom = getCurrentRoom();
          const roomKey = getRoomFirebaseKey(curRoom);
          if (db) {
            db.ref(`rooms/${roomKey}/messages`).remove();
            db.ref(`rooms/${roomKey}/latestMsg`).remove();
          } else {
            currentMessages = [];
            chatTimeline.innerHTML = '<div class="timeline-empty-notice">💬 まだメッセージはありません。<br>下のクイックボタンで声を掛けましょう！</div>';
          }
          bc.postMessage({ type: 'CLEAR_ALL', groupId: roomKey });
        }
      });

      bc.onmessage = (e) => {
        const data = e.data;
        if (!data) return;

        const curRoom = getCurrentRoom();
        const roomKey = getRoomFirebaseKey(curRoom);

        if (data.type === 'NEW_MSG' && !db) {
          const msg = data.msg;
          if (msg.groupId === roomKey) {
            currentMessages.push(msg);
            renderSingleMessage(msg);
            scrollToBottom();
            playNotificationSound();
          }
          if (msg.senderName !== appState.userName) {
            unreadCount++;
            updateBadgeUI();
            showDesktopNotification(msg);
          }
        }
      };

      function renderMembers() {
        membersList.innerHTML = '';
        const curRoom = getCurrentRoom();
        const roomKey = getRoomFirebaseKey(curRoom);

        const displayName = (appState.userName || '').trim() || 'メンバー';
        const customAvatarChar = (appState.userAvatarChar || '').trim();
        const myAvatar = customAvatarChar ? customAvatarChar.charAt(0) : displayName.charAt(0).toUpperCase();
        
        const isMyVcActive = isVcConnected;
        addAvatarBadge(myAvatar, `${displayName} (${appState.userStatus}) ${isMyVcActive ? '🎤VC接続中' : ''}`, true, selectedAvatarShape, isMyVcActive);

        Object.values(activeMembers).forEach(m => {
          if (m.id !== myId && m.groupId === roomKey) {
            const isPeerVc = !!vcMembers[m.id];
            addAvatarBadge(m.avatarLetter, `${m.name} (${m.status}) ${isPeerVc ? '🎤VC接続中' : ''}`, true, m.avatarShape || 'shape-circle', isPeerVc);
          }
        });
      }

      function addAvatarBadge(letter, titleText, isOnline, shapeClass, isVcActive) {
        const badge = document.createElement('div');
        const shape = shapeClass || 'shape-circle';
        badge.className = `avatar-badge ${shape} ${isOnline ? 'online' : ''} ${isVcActive ? 'speaking' : ''}`;
        badge.textContent = letter;
        badge.title = titleText;
        membersList.appendChild(badge);
      }

      function renderMessages(messages) {
        chatTimeline.innerHTML = '';
        if (messages.length === 0) {
          chatTimeline.innerHTML = `<div class="timeline-empty-notice">💬 まだメッセージはありません。<br>下のクイックボタンで声を掛けましょう！</div>`;
          return;
        }
        messages.forEach(m => renderSingleMessage(m));
        scrollToBottom();
      }

      function updateReadBadgesOnly() {
        currentMessages.forEach(msg => {
          const msgElem = document.getElementById(`msg_${msg.id}`);
          if (!msgElem) return;

          const footerInfo = msgElem.querySelector('.msg-footer-info');
          if (!footerInfo) return;

          const readUserNames = [];
          const msgTime = msg.timestampMs || 0;

          Object.values(userLastReadTimes).forEach(readInfo => {
            if (readInfo && readInfo.userId !== (msg.senderId || '')) {
              if (readInfo.userId !== myId && (readInfo.readTime >= (msgTime - 60000))) {
                readUserNames.push(readInfo.userName || '相手');
              }
            }
          });

          const readCount = readUserNames.length;
          let statusBadge = footerInfo.querySelector('.msg-read-status');

          if (readCount > 0) {
            const names = readUserNames.join(', ');
            if (!statusBadge) {
              statusBadge = document.createElement('div');
              statusBadge.className = 'msg-read-status';
              footerInfo.insertBefore(statusBadge, footerInfo.firstChild);
            }
            statusBadge.textContent = `👀 既読 ${readCount}`;
            statusBadge.title = `既読: ${names}`;
          } else if (statusBadge) {
            statusBadge.remove();
          }
        });
      }

      function linkifyText(text) {
        if (!text) return '';
        const escaped = escapeHTML(text);
        const urlPattern = /(https?:\/\/[^\s]+)/g;
        return escaped.replace(urlPattern, url => `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`);
      }

      window.openLightbox = function(src) {
        lightboxImg.src = src;
        lightboxModal.style.display = 'flex';
      };

      lightboxModal.addEventListener('click', () => {
        lightboxModal.style.display = 'none';
        lightboxImg.src = '';
      });

      function renderSingleMessage(msg) {
        const notice = chatTimeline.querySelector('.timeline-empty-notice');
        if (notice) notice.remove();

        if (document.getElementById(`msg_${msg.id}`)) return;

        const isSelf = (msg.senderId === myId);
        const shapeClass = isSelf ? selectedAvatarShape : (msg.avatarShape || 'shape-circle');

        const item = document.createElement('div');
        item.className = `msg-item ${isSelf ? 'self-msg' : ''}`;
        item.id = `msg_${msg.id}`;

        let bodyContent = '';
        if (msg.stamp) {
          bodyContent = `<div class="msg-stamp">${escapeHTML(msg.stamp)}</div>`;
        } else if (msg.text) {
          bodyContent = `<div class="msg-text">${linkifyText(msg.text)}</div>`;
        }

        if (msg.file && msg.file.data) {
          const fileName = msg.file.name || '添付ファイル';
          const fileType = (msg.file.type || '').toLowerCase();
          
          if (fileType.startsWith('image/')) {
            bodyContent += `<div style="margin-top:4px;"><img src="${msg.file.data}" class="attached-image-thumb" onclick="openLightbox('${msg.file.data}')" title="クリックで拡大表示" /></div>`;
          } else {
            let fileIcon = '💾';
            if (fileName.match(/\.(xlsx|xls|csv)$/i)) fileIcon = '📊';
            else if (fileName.match(/\.(docx|doc|txt)$/i)) fileIcon = '📝';
            else if (fileName.match(/\.pdf$/i)) fileIcon = '📄';
            else if (fileName.match(/\.(zip|rar|7z)$/i)) fileIcon = '📦';

            bodyContent += `
              <div style="margin-top:4px;">
                <a href="${msg.file.data}" download="${escapeHTML(fileName)}" class="attached-file-box" title="クリックしてダウンロード・開く">
                  <span>${fileIcon} ${escapeHTML(fileName)}</span>
                  <span style="font-size:9px; opacity:0.8; margin-left:4px;">[開く/保存]</span>
                </a>
              </div>`;
          }
        }

        const readUserNames = [];
        const msgTime = msg.timestampMs || 0;

        Object.values(userLastReadTimes).forEach(readInfo => {
          if (readInfo && readInfo.userId !== (msg.senderId || '')) {
            if (readInfo.userId !== myId && (readInfo.readTime >= (msgTime - 60000))) {
              readUserNames.push(readInfo.userName || '相手');
            }
          }
        });
        
        const readCount = readUserNames.length;
        
        let readBadgeHTML = '';
        if (readCount > 0) {
          const names = readUserNames.join(', ');
          readBadgeHTML = `<div class="msg-read-status" title="既読: ${escapeHTML(names)}">👀 既読 ${readCount}</div>`;
        }

        item.innerHTML = `
          <div class="msg-avatar ${shapeClass}" title="${escapeHTML(msg.senderName)}">${escapeHTML(msg.avatarLetter)}</div>
          <div class="msg-body">
            ${bodyContent}
            <div class="msg-footer-info">
              ${readBadgeHTML}
              <div class="msg-footer-right">
                <span class="msg-time">${msg.timestamp}</span>
                <button class="msg-delete-btn" onclick="deleteSingleMsg('${msg.id}')" title="削除">✕</button>
              </div>
            </div>
          </div>
        `;

        chatTimeline.appendChild(item);
      }

      window.deleteSingleMsg = function(msgId) {
        const curRoom = getCurrentRoom();
        const roomKey = getRoomFirebaseKey(curRoom);
        if (db) {
          db.ref(`rooms/${roomKey}/messages/${msgId}`).remove();
        } else {
          currentMessages = currentMessages.filter(m => m.id !== msgId);
          const elem = document.getElementById(`msg_${msgId}`);
          if (elem) elem.remove();
        }
      };

      function scrollToBottom() {
        chatTimeline.scrollTop = chatTimeline.scrollHeight;
      }

      function showDesktopNotification(msg) {
        if ('Notification' in window && Notification.permission !== 'granted' && Notification.permission !== 'denied') {
          Notification.requestPermission();
        }
        if ('Notification' in window && Notification.permission === 'granted') {
          const curRoom = getCurrentRoom();
          const n = new Notification(`⚡ [${curRoom.name}] ${msg.senderName}さんからの声掛け`, {
            body: msg.stamp || msg.text || 'ファイルが届きました',
            icon: '/favicon.ico'
          });
          n.onclick = () => {
            window.focus();
            markCurrentMessagesAsRead();
          };
        }
      }

      function escapeHTML(str) {
        return (str || '').replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
      }

      init();
    });
  </script>
</body>
</html>
